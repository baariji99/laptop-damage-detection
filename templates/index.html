<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Laptop Screen Damage Detection</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .container {

            width: 550px;

            max-width: 90%;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.25);

            text-align: center;

        }


        h1 {

            margin-top: 0;

            color: #222;

        }


        .subtitle {

            color: #666;

            margin-bottom: 30px;

        }


        .upload-box {

            border: 2px dashed #667eea;

            padding: 30px;

            border-radius: 15px;

            margin-bottom: 25px;

        }


        input[type="file"] {

            width: 100%;

            margin: 10px 0;

        }


        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #667eea;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            background: #5568d8;

        }


        .result {

            margin-top: 30px;

            padding: 25px;

            border-radius: 15px;

            background: #f5f7ff;

        }


        .prediction {

            font-size: 30px;

            font-weight: bold;

            margin: 15px 0;

            text-transform: capitalize;

        }


        .confidence {

            font-size: 20px;

            color: #444;

        }


        .filename {

            color: #777;

            font-size: 14px;

        }


        .error {

            margin-top: 20px;

            padding: 15px;

            background: #ffe5e5;

            color: #c00;

            border-radius: 10px;

        }


        .footer {

            margin-top: 25px;

            font-size: 13px;

            color: #999;

        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        💻 Laptop Screen Damage Detection
    </h1>


    <p class="subtitle">

        Upload a laptop screen image
        to detect damage

    </p>


    <form
        action="/predict"
        method="POST"
        enctype="multipart/form-data"
    >


        <div class="upload-box">

            <input
                type="file"
                name="file"
                accept="image/*"
                required
            >

        </div>


        <button type="submit">

            Analyze Image

        </button>


    </form>


    {% if prediction %}

    <div class="result">

        <h2>
            Prediction
        </h2>


        <div class="prediction">

            {{ prediction }}

        </div>


        <div class="confidence">

            Confidence:
            <strong>
                {{ confidence }}%
            </strong>

        </div>


        <p class="filename">

            File:
            {{ filename }}

        </p>

    </div>

    {% endif %}


    {% if error %}

    <div class="error">

        <strong>Error:</strong>

        {{ error }}

    </div>

    {% endif %}


    <div class="footer">

        Powered by TensorFlow + MobileNetV2

    </div>


</div>


</body>

</html>
