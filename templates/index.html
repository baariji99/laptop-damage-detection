<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laptop Screen Damage Detection</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        input[type="file"] {
            margin: 20px 0;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            background: #f1f5f9;
        }

        .result h2 {
            margin-top: 0;
        }

        .error {
            margin-top: 20px;
            padding: 15px;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 6px;
        }

        .broken {
            color: #dc2626;
        }

        .normal {
            color: #16a34a;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Laptop Screen Damage Detection</h1>

    <p class="subtitle">
        Upload a laptop screen image to detect whether it is broken or normal.
    </p>

    <form action="/predict" method="POST" enctype="multipart/form-data">

        <input
            type="file"
            name="image"
            accept="image/*"
            required
        >

        <br>

        <button type="submit">
            Detect Damage
        </button>

    </form>

    {% if prediction %}

    <div class="result">

        <h2>Prediction</h2>

        <h3 class="{{ prediction }}">
            {{ prediction | upper }}
        </h3>

        <p>
            Confidence:
            <strong>{{ confidence }}</strong>
        </p>

    </div>

    {% endif %}

    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}

</div>

</body>

</html>
